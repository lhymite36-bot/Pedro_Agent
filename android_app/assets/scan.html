<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;height:100%;background:#0B0B0F;color:#ECECF1;font-family:sans-serif}
video{width:100%;height:100%;object-fit:cover}#hint{position:fixed;top:20px;left:0;right:0;text-align:center;font-size:16px;text-shadow:0 1px 3px #000}
#frame{position:fixed;left:50%;top:50%;width:64vw;height:64vw;transform:translate(-50%,-50%);border:3px solid #7cc4ff;border-radius:18px;box-shadow:0 0 0 9999px rgba(0,0,0,.45)}
button{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);padding:12px 28px;border:0;border-radius:24px;background:#ECECF1;color:#0B0B0F;font-size:16px}</style></head>
<body><video id="v" playsinline muted></video><div id="frame"></div><div id="hint">Point at the QR code in Pedro Agent › Settings › Connect phone</div>
<button onclick="PedroNative.scanCancel()">Cancel</button><canvas id="c" hidden></canvas>
<script src="jsQR.js"></script><script>
const v=document.getElementById('v'),c=document.getElementById('c'),x=c.getContext('2d',{willReadFrequently:true});let done=false;
navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}).then(s=>{v.srcObject=s;v.play();requestAnimationFrame(tick)})
 .catch(e=>{document.getElementById('hint').textContent='Camera not available: '+e.message+'. Use Cancel and type the link and code instead.'});
function tick(){if(done)return;if(v.readyState===v.HAVE_ENOUGH_DATA){const w=v.videoWidth,h=v.videoHeight,k=Math.min(1,640/Math.max(w,h));c.width=w*k;c.height=h*k;x.drawImage(v,0,0,c.width,c.height);
const r=jsQR(x.getImageData(0,0,c.width,c.height).data,c.width,c.height,{inversionAttempts:'dontInvert'});
if(r&&r.data&&r.data.indexOf('pedroagent://pair')===0){done=true;(v.srcObject&&v.srcObject.getTracks()||[]).forEach(t=>t.stop());PedroNative.scanned(r.data);return;}}requestAnimationFrame(tick);}
</script></body></html>
